name: Joane menu validation (temporary)
on:
  push:
    branches: [research/joane-service-menu]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test services and booking system
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify the service menus are real booking options, not screenshots
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,existsSync} from 'node:fs';
          import {SERVICES,ADDITIONAL_SERVICES,durationFor} from './booking-config.js';
          const home=readFileSync('dist/index.html','utf8');
          const booking=readFileSync('dist/booking.js','utf8');
          if(!home.includes('id="bookable-service-menu"'))throw Error('Service catalog missing');
          if(!home.includes('service-menu.js'))throw Error('Homepage service module missing');
          if(home.includes('joane-service-sheet')||existsSync('dist/public/images/services'))throw Error('Raw service screenshots still published');
          if(!booking.includes('groupedOrder')||ADDITIONAL_SERVICES.length!==15)throw Error('Booking choices missing');
          for(const s of ADDITIONAL_SERVICES)if(!SERVICES.some(x=>x.id===s.id)||durationFor(s.id,'none')!==120)throw Error('Service not bookable: '+s.id);
          console.log('Validated 15 new bookable services; no menu screenshots are published.');
          JS
      - name: Portfolio audit
        run: |
          python -m pip install --quiet Pillow
          python scripts/check-portfolio.py
