name: Booking QA build and unit validation
on:
  push:
    branches: [qa/booking-end-to-end]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run booking logic tests
        run: npm test
      - name: Verify production-style static build
        run: npm run build
      - name: Verify QA safety code and assets
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {existsSync,readFileSync} from 'node:fs';
          const api=readFileSync('api/booking.js','utf8');
          const client=readFileSync('dist/booking.js','utf8');
          assert.match(api,/BOOKING_TEST_MODE/);
          assert.match(client,/TEST SITE/);
          assert.match(client,/Do not send any deposit/);
          assert.ok(existsSync('dist/assets/joane-zelle-qr.png'));
          console.log('QA safety checks passed.');
          JS
