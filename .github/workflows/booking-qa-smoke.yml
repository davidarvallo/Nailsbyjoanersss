name: Booking QA build and unit validation
on:
  push:
    branches: [qa/booking-end-to-end]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run booking logic tests
        run: npm test
      - name: Verify production-style static build
        run: npm run build
      - name: Verify hand nail examples are removed from pedicure category
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {runInNewContext} from 'node:vm';
          const window={};
          runInNewContext(readFileSync('dist/portfolio-data.js','utf8'),{window});
          const archive=window.PORTFOLIO_PHOTOS.filter(p=>p.id.startsWith('joane-'));
          const pedis=archive.filter(p=>p.category==='pedicures');
          const nails=archive.filter(p=>p.category==='nails');
          assert.equal(archive.length,15);
          assert.equal(pedis.length,11);
          assert.equal(nails.length,4);
          for(const name of ['image10.jpg','image15.jpg','image6.jpg','image9.jpg']){
            assert.equal(nails.find(p=>p.source.toLowerCase()===name)?.category,'nails',name);
          }
          console.log('Archive categories verified: 11 pedicures, 4 nail sets.');
          JS
      - name: Verify QA safety code and assets
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {existsSync,readFileSync} from 'node:fs';
          const api=readFileSync('api/booking.js','utf8');
          const client=readFileSync('dist/booking.js','utf8');
          assert.match(api,/BOOKING_TEST_MODE/);
          assert.match(client,/TEST SITE/);
          assert.match(client,/Do not send any deposit/);
          assert.ok(existsSync('dist/assets/joane-zelle-qr.png'));
          console.log('QA safety checks passed.');
          JS
